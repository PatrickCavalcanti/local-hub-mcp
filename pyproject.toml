[project]
name = "local-hub-mcp"
version = "0.1.0"
description = "Conexão única (OpenAI /v1 + MCP) para usar e gerenciar modelos llama.cpp locais"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Patrick Cavalcanti" }]
keywords = ["llama.cpp", "mcp", "openai", "gguf", "local-llm", "gateway"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "starlette>=1.0",
  "uvicorn>=0.30",
  "httpx>=0.28",
  "mcp>=2.3,<3",
  "huggingface_hub>=2.0",
  "psutil>=6",
]

[project.urls]
Homepage = "https://github.com/PatrickCavalcanti/local-hub-mcp"
Repository = "https://github.com/PatrickCavalcanti/local-hub-mcp"
Issues = "https://github.com/PatrickCavalcanti/local-hub-mcp/issues"

[project.scripts]
local-hub-mcp = "local_hub_mcp.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_hub_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "ffmpeg: precisa do ffmpeg instalado (pula se não houver)",
  "windows: só roda no Windows",
]
